---
- name: Install webhook package
  ansible.builtin.apt:
    name: "webhook={{ webhook_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    allow_downgrade: true
    allow_change_held_packages: true

- name: Hold webhook package at the pinned version
  ansible.builtin.dpkg_selections:
    name: webhook
    selection: hold
